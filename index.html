<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRMNL Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&display=swap">
<style>
:root { background: #F2F0ED; }
@media (prefers-color-scheme: dark) { :root { background: #151515; color-scheme: dark; } }
body { margin: 0; }
main { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 64px; }
</style>
</head>
<body>
<main id="catalog"></main>
<script type="module">
import { mountCatalog } from './catalog.js';
// TRMNL Apps Studio for the web is not hosted yet: ?studio=<url> (a local Studio while testing) adds Open in Studio.
const studio = new URLSearchParams(location.search).get('studio');
mountCatalog(document.getElementById('catalog'), {
  indexURL: 'index.json',
  actions: (app, tappURL) => [
    studio && { label: 'Open in Studio', primary: true, href: `${studio}?install=${encodeURIComponent(tappURL)}&sha256=${app.sha256}` },
    { label: 'Download .tapp', primary: !studio, href: tappURL },
    app.source && { label: 'Source', href: app.source },
  ].filter(Boolean),
});
</script>
</body>
</html>
