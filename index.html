<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRMNL Apps Registry</title>
<style>
:root {
  --bg: #F2F0ED; --surface: #FBFAF8; --line: #DCDBD9; --ink: #151515; --muted: #5B5B5B; --faint: #8F8F8F;
  --accent: #F8654B; --accent-ink: #B94938; --inset: #E8E7E4;
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #151515; --surface: #202020; --line: #2E2E2E; --ink: #E8E7E4; --muted: #AAAAAA;
    --faint: #7D7D7D; --accent-ink: #FF9280; --inset: #181818; }
}
body { margin: 0; background: var(--bg); color: var(--ink); }
main { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 64px; display: grid; gap: 28px; }
h1 { margin: 0; font-size: 30px; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 65ch; }
#apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.shot { aspect-ratio: 1872 / 1404; border-radius: 6px; background: var(--inset); object-fit: cover; width: 100%; }
.title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.title h2 { margin: 0; font-size: 18px; }
.ver { font: 12px/1 ui-monospace, Menlo, monospace; color: var(--faint); }
.summary { margin: 0; color: var(--muted); }
.meta { font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.fork { font-size: 13px; color: var(--accent-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; } /* same row on every card */
.actions a { font-size: 13px; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); }
.actions a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.actions a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>TRMNL Apps</h1>
    <p>Community apps for TRMNL, checked by CI against the device's own rules. Open one in TRMNL Apps Studio to try it in the simulator, install it on your TRMNL over Wi-Fi, or fork it.</p>
  </header>
  <p id="status">Loading the catalog…</p>
  <section id="apps" aria-label="Apps"></section>
</main>
<script type="module">
// The Studio that opens apps: ?studio=<url> overrides it (a local Studio while testing).
const studio = new URLSearchParams(location.search).get('studio') ?? 'http://localhost:8765/';
function el(tag, props = {}, ...children) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children.filter(Boolean));
  return e;
}

async function main() {
  const status = document.getElementById('status');
  let index;
  try { index = await (await fetch('index.json', { cache: 'no-cache' })).json(); }
  catch { status.textContent = 'The catalog could not be loaded.'; return; }
  const byId = new Map(index.apps.map((a) => [a.id, a]));
  status.textContent = `${index.apps.length} apps`;
  for (const a of index.apps) {
    const tappURL = new URL(a.tapp, location.href).href;
    const origin = a.forked_from && (byId.get(a.forked_from.id)?.name ?? a.forked_from.id);
    document.getElementById('apps').append(el('article', { className: 'card' },
      a.screenshot ? el('img', { className: 'shot', src: a.screenshot, alt: `${a.name} on a TRMNL X` }) : null,
      el('div', { className: 'title' }, el('h2', { textContent: a.name }), el('span', { className: 'ver', textContent: `v${a.version}` })),
      el('p', { className: 'summary', textContent: a.summary }),
      origin ? el('div', { className: 'fork', textContent: `Forked from ${origin} ${a.forked_from.version}` }) : null,
      el('div', { className: 'meta' },
        el('span', { textContent: a.author }), el('span', { textContent: a.license }),
        el('span', { textContent: `${(a.size / 1024).toFixed(1)} KB` }),
        el('span', { textContent: a.has_source ? 'source included' : 'no source' }),
        a.versions.length > 1 ? el('span', { textContent: `${a.versions.length} versions` }) : null),
      el('div', { className: 'actions' },
        el('a', { className: 'primary', href: `${studio}?install=${encodeURIComponent(tappURL)}&sha256=${a.sha256}`, textContent: 'Open in Studio' }),
        el('a', { href: a.tapp, textContent: 'Download .tapp' }),
        a.source ? el('a', { href: a.source, textContent: 'Source', rel: 'noopener' }) : null)));
  }
}
main();
</script>
</body>
</html>
